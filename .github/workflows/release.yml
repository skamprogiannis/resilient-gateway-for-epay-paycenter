name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  release:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build WordPress package
        run: scripts/build-release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --generate-notes --verify-tag
