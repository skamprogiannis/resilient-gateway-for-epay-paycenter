name: Quality

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v7.0.1
      - if: matrix.php == '8.3'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - if: matrix.php == '8.3'
        run: composer install --no-interaction --prefer-dist
      - run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - if: matrix.php == '8.3'
        run: composer test

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  public-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: scripts/check-public-tree.sh
      - run: scripts/check-public-history.sh

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: bash scripts/prepare-tests.sh
      - run: npm run test:integration
      - run: npm run test:matrix
      - name: Qualify payment reviews with HPOS
        run: |
          docker compose -f compose.test.yml run --rm wpcli wp wc hpos sync
          docker compose -f compose.test.yml run --rm wpcli wp option update woocommerce_custom_orders_table_enabled yes
          npm run test:integration -- --grep @review
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: qualification-results
          path: artifacts/
      - if: always()
        run: docker compose -f compose.test.yml down -v
