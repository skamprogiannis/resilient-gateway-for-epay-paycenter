name: Quality

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.php == '8.3'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - if: matrix.php == '8.3'
        run: composer install --no-interaction --prefer-dist
      - run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - if: matrix.php == '8.3'
        run: composer test

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  public-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: scripts/check-public-tree.sh
      - run: scripts/check-public-history.sh

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: bash scripts/prepare-tests.sh
      - name: Select legacy order storage for the primary suite
        run: |
          docker compose -f compose.test.yml run --rm wpcli wp wc hpos sync
          docker compose -f compose.test.yml run --rm wpcli wp option update woocommerce_custom_orders_table_enabled no
      - run: npm run test:integration
      - run: npm run test:matrix
      - name: Qualify payment recovery and reviews with HPOS
        run: |
          docker compose -f compose.test.yml run --rm wpcli wp wc hpos sync
          docker compose -f compose.test.yml run --rm wpcli wp option update woocommerce_custom_orders_table_enabled yes
          npm run test:integration -- --grep '@review|@recovery-settings|@recovery-window|@payment-race|@native-cancel-race|@due-attempts|@callback-privacy|@signed-decisions|@durable-ticket|@durable-approval|@activation'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-results
          path: artifacts/
      - if: always()
        run: docker compose -f compose.test.yml down -v
